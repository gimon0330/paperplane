<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paperplane Flight</title>
    <meta name="description" content="A small 3D paper plane flight game playable on mobile and desktop browsers." />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Paperplane 3D game"></canvas>

      <section class="topbar" aria-live="polite">
        <span>D <strong id="distance">0.0 m</strong></span>
        <span>B <strong id="best-distance">0.0 m</strong></span>
        <span>A <strong id="angle">0°</strong></span>
      </section>

      <section class="meter-panel">
        <div class="meter" title="Angle / Boost"><div id="boost-fill" class="meter-fill"></div></div>
        <span id="phase-text">Hold ↓ · Release</span>
      </section>

      <button id="self-destruct-btn" class="self-destruct" aria-label="Self destruct">자폭</button>

      <section class="controls" aria-label="Game controls">
        <button id="left-btn" class="control-button" aria-label="Turn left">←</button>
        <button id="down-btn" class="control-button primary" aria-label="Launch angle or boost">↓</button>
        <button id="right-btn" class="control-button" aria-label="Turn right">→</button>
      </section>

      <dialog id="result-dialog" class="result-dialog">
        <h1>Result</h1>
        <p id="result-distance">0.0 m</p>
        <p id="result-best">Best 0.0 m</p>

        <form id="score-form" class="score-form" method="dialog">
          <input id="nickname-input" maxlength="16" placeholder="nickname" autocomplete="nickname" />
          <button id="save-score-btn" type="submit">Save</button>
        </form>
        <p id="score-status" class="score-status"></p>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>

        <button id="restart-btn">Restart</button>
      </dialog>
    </main>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/ui-actions-v2.js"></script>
  </body>
</html>
