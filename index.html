<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paperplane Flight</title>
    <meta
      name="description"
      content="A small 3D paper plane flight game playable on mobile and desktop browsers."
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Paperplane 3D game"></canvas>

      <section class="hud hud-top" aria-live="polite">
        <div>
          <span class="label">Distance</span>
          <strong id="distance">0.0 m</strong>
        </div>
        <div>
          <span class="label">Best</span>
          <strong id="best-distance">0.0 m</strong>
        </div>
      </section>

      <section class="hud status-panel">
        <div class="angle-row">
          <span class="label">Launch Angle</span>
          <strong id="angle">45°</strong>
        </div>
        <div class="meter" title="Limited boost">
          <div id="boost-fill" class="meter-fill"></div>
        </div>
        <span id="phase-text" class="phase-text">Hold ↓ to set angle, release to throw.</span>
      </section>

      <section class="controls" aria-label="Game controls">
        <button id="left-btn" class="control-button" aria-label="Turn left">←</button>
        <button id="down-btn" class="control-button primary" aria-label="Launch angle or boost">↓</button>
        <button id="right-btn" class="control-button" aria-label="Turn right">→</button>
      </section>

      <aside class="desktop-help">
        <strong>Desktop</strong>
        <span>Hold <kbd>S</kbd>/<kbd>↓</kbd> to set angle · Release to throw · Fly with <kbd>A</kbd>/<kbd>D</kbd> and boost with <kbd>S</kbd></span>
      </aside>

      <dialog id="result-dialog" class="result-dialog">
        <h1>Flight Result</h1>
        <p id="result-distance">Distance: 0.0 m</p>
        <p id="result-best">Best: 0.0 m</p>
        <button id="restart-btn">Restart</button>
      </dialog>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
